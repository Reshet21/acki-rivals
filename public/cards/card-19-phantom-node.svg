<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#1a0a2a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="phantom19" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#666666"/>
      <stop offset="100%" stop-color="#333333"/>
    </linearGradient>
    <filter id="glow19">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg19)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#phantom19)" stroke-width="1.5" opacity="0.5"/>
  <!-- Phantom node -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#666666" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,5"/>
  <circle cx="100" cy="100" r="25" fill="none" stroke="#999999" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <circle cx="100" cy="100" r="15" fill="#666666" opacity="0.15"/>
  <!-- Phantom effect -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#999999" stroke-width="0.5" opacity="0.2" filter="url(#glow19)"/>
  <!-- Ghost eyes -->
  <circle cx="90" cy="95" r="3" fill="#999999" opacity="0.5"/>
  <circle cx="110" cy="95" r="3" fill="#666666" opacity="0.5"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#666666" opacity="0.5">ФАНТОМНАЯ НОДА</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#333333" opacity="0.3">ACKI NACKI</text>
</svg>