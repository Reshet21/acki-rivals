<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg41" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="50%" stop-color="#0a2a10"/>
      <stop offset="100%" stop-color="#0a1a0a"/>
    </linearGradient>
    <linearGradient id="alchemist41" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc44"/>
    </linearGradient>
    <filter id="glow41">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg41)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#alchemist41)" stroke-width="1.5" opacity="0.5"/>
  <!-- Hash alchemist -->
  <path d="M85,90 L85,120 L65,160 Q60,175 75,180 L125,180 Q140,175 135,160 L115,120 L115,90" 
        fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.6"/>
  <rect x="80" y="85" width="40" height="8" rx="2" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
  <!-- Hash symbols in flask -->
  <text x="90" y="150" font-family="monospace" font-size="8" fill="#00ff88" opacity="0.3">#</text>
  <text x="100" y="160" font-family="monospace" font-size="8" fill="#00cc44" opacity="0.3">#</text>
  <text x="110" y="150" font-family="monospace" font-size="8" fill="#00ff88" opacity="0.3">#</text>
  <!-- Vapor -->
  <path d="M90,85 Q85,70 90,55" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.3"/>
  <path d="M100,83 Q95,65 100,50" fill="none" stroke="#00cc44" stroke-width="0.8" opacity="0.25"/>
  <path d="M110,85 Q115,70 110,55" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.3"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff88" opacity="0.5">АЛХИМИК ХЕШЕЙ</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#00cc44" opacity="0.3">ACKI NACKI</text>
</svg>