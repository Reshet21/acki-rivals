<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg42" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2a"/>
      <stop offset="50%" stop-color="#10103a"/>
      <stop offset="100%" stop-color="#0a0a2a"/>
    </linearGradient>
    <linearGradient id="blue42" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4488ff"/>
      <stop offset="100%" stop-color="#2266cc"/>
    </linearGradient>
    <filter id="glow42">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg42)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#blue42)" stroke-width="1.5" opacity="0.5"/>
  <!-- Shield shape -->
  <path d="M100,55 L145,80 L145,140 Q145,170 100,195 Q55,170 55,140 L55,80 Z" 
        fill="none" stroke="#4488ff" stroke-width="2" opacity="0.6" filter="url(#glow42)"/>
  <path d="M100,70 L135,90 L135,135 Q135,158 100,178 Q65,158 65,135 L65,90 Z" 
        fill="#4488ff" opacity="0.08"/>
  <!-- Inner cross -->
  <line x1="100" y1="75" x2="100" y2="175" stroke="#4488ff" stroke-width="1" opacity="0.3"/>
  <line x1="65" y1="120" x2="135" y2="120" stroke="#4488ff" stroke-width="1" opacity="0.3"/>
  <!-- Corner gems -->
  <circle cx="100" cy="75" r="4" fill="#4488ff" opacity="0.5" filter="url(#glow42)"/>
  <circle cx="70" cy="100" r="3" fill="#2266cc" opacity="0.4"/>
  <circle cx="130" cy="100" r="3" fill="#2266cc" opacity="0.4"/>
  <circle cx="100" cy="175" r="3" fill="#4488ff" opacity="0.4"/>
  <!-- Data ring -->
  <circle cx="100" cy="120" r="35" fill="none" stroke="#4488ff" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,6"/>
  <!-- Hex pattern -->
  <polygon points="100,105 110,112 110,128 100,135 90,128 90,112" fill="none" stroke="#2266cc" stroke-width="0.8" opacity="0.3"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#4488ff" opacity="0.5">ХРАНИТЕЛЬ // KEEPER</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#2266cc" opacity="0.3">DIGITAL MONKS</text>
</svg>