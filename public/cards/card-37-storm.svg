<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg37" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2a"/>
      <stop offset="50%" stop-color="#050520"/>
      <stop offset="100%" stop-color="#0a0a2a"/>
    </linearGradient>
    <linearGradient id="bolt37" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffff00"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </linearGradient>
    <filter id="glow37">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg37)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Storm clouds -->
  <ellipse cx="60" cy="60" rx="50" ry="25" fill="#1a1a3a" opacity="0.6"/>
  <ellipse cx="140" cy="65" rx="45" ry="22" fill="#1a1a3a" opacity="0.5"/>
  <ellipse cx="100" cy="55" rx="55" ry="28" fill="#15152a" opacity="0.7"/>
  <!-- Lightning bolts -->
  <path d="M90,80 L95,110 L85,115 L100,150 L90,155 L105,195" fill="none" stroke="url(#bolt37)" stroke-width="2.5" filter="url(#glow37)" opacity="0.9"/>
  <path d="M130,90 L125,115 L135,120 L120,145" fill="none" stroke="#ffff00" stroke-width="1.5" filter="url(#glow37)" opacity="0.6"/>
  <path d="M60,85 L65,105 L55,110 L70,140" fill="none" stroke="#00aaff" stroke-width="1.5" filter="url(#glow37)" opacity="0.5"/>
  <!-- Rain streaks -->
  <line x1="30" y1="90" x2="25" y2="120" stroke="#4488ff" stroke-width="0.5" opacity="0.3"/>
  <line x1="50" y1="95" x2="45" y2="125" stroke="#4488ff" stroke-width="0.5" opacity="0.3"/>
  <line x1="150" y1="90" x2="145" y2="120" stroke="#4488ff" stroke-width="0.5" opacity="0.3"/>
  <line x1="170" y1="100" x2="165" y2="130" stroke="#4488ff" stroke-width="0.5" opacity="0.3"/>
  <line x1="110" y1="85" x2="105" y2="115" stroke="#4488ff" stroke-width="0.5" opacity="0.3"/>
  <!-- Energy rings -->
  <circle cx="100" cy="130" r="45" fill="none" stroke="#4488ff" stroke-width="0.5" opacity="0.2"/>
  <circle cx="100" cy="130" r="55" fill="none" stroke="#00aaff" stroke-width="0.5" opacity="0.15"/>
  <!-- Ground flash -->
  <ellipse cx="100" cy="200" rx="60" ry="8" fill="#4488ff" opacity="0.1"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#4488ff" opacity="0.5">ШТОРМ // STORM</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#00aaff" opacity="0.3">NEON MERCENARIES</text>
</svg>