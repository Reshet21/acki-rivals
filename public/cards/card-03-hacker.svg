<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="50%" stop-color="#2a0a0a"/>
      <stop offset="100%" stop-color="#1a0505"/>
    </linearGradient>
    <linearGradient id="neon3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0044"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg3)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#neon3)" stroke-width="1.5" opacity="0.6"/>
  <!-- Broken block -->
  <path d="M60,70 L100,60 L140,70 L140,120 L100,130 L60,120 Z" fill="none" stroke="#ff0044" stroke-width="2" opacity="0.7"/>
  <path d="M80,80 L120,75 L125,110 L85,115 Z" fill="#ff0044" opacity="0.1"/>
  <!-- Crack -->
  <path d="M90,75 L100,95 L95,115 L105,130" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.8" filter="url(#glow3)"/>
  <!-- Glitch lines -->
  <rect x="55" y="85" width="90" height="2" fill="#ff0044" opacity="0.4"/>
  <rect x="60" y="95" width="80" height="1" fill="#ff6600" opacity="0.3"/>
  <rect x="65" y="105" width="75" height="2" fill="#ff0044" opacity="0.4"/>
  <!-- Warning symbol -->
  <polygon points="100,150 110,170 90,170" fill="none" stroke="#ff0044" stroke-width="1.5" opacity="0.6"/>
  <text x="100" y="165" text-anchor="middle" font-family="monospace" font-size="8" fill="#ff0044" opacity="0.8">!</text>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff0044" opacity="0.5">ХАКЕР БЛОКА</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff6600" opacity="0.3">ACKI NACKI</text>
</svg>