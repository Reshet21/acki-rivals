<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="50%" stop-color="#0a2030"/>
      <stop offset="100%" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="chain11" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4488ff"/>
      <stop offset="100%" stop-color="#2266cc"/>
    </linearGradient>
    <filter id="glow11">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg11)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#chain11)" stroke-width="1.5" opacity="0.5"/>
  <!-- Acolyte figure -->
  <circle cx="100" cy="70" r="15" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M85,85 L100,100 L115,85" fill="none" stroke="#2266cc" stroke-width="1" opacity="0.4"/>
  <path d="M85,100 L100,130 L115,100" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.4"/>
  <!-- Chain links -->
  <circle cx="80" cy="120" r="8" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.3"/>
  <circle cx="120" cy="120" r="8" fill="none" stroke="#2266cc" stroke-width="1" opacity="0.3"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#4488ff" opacity="0.5">ПОСЛУШНИК ЦЕПИ</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#2266cc" opacity="0.3">ACKI NACKI</text>
</svg>