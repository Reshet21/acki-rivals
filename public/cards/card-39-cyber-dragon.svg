<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg39" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0020"/>
      <stop offset="50%" stop-color="#200040"/>
      <stop offset="100%" stop-color="#0a0020"/>
    </linearGradient>
    <linearGradient id="dragon39" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="50%" stop-color="#aa00ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="glow39">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow39b">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg39)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#dragon39)" stroke-width="2" opacity="0.7"/>
  <!-- Dragon head silhouette (geometric/cyber) -->
  <path d="M100,50 L130,80 L140,75 L135,100 L150,110 L140,120 L145,140 L120,135 L100,150 L80,135 L55,140 L60,120 L50,110 L65,100 L60,75 L70,80 Z" 
        fill="none" stroke="url(#dragon39)" stroke-width="2" filter="url(#glow39)" opacity="0.8"/>
  <!-- Eye -->
  <circle cx="100" cy="95" r="8" fill="#ff00ff" opacity="0.3"/>
  <circle cx="100" cy="95" r="4" fill="#ff00ff" opacity="0.8" filter="url(#glow39)"/>
  <circle cx="100" cy="95" r="2" fill="#ffffff" opacity="0.9"/>
  <!-- Circuit veins -->
  <path d="M100,110 L100,130 L85,145 L85,160" fill="none" stroke="#aa00ff" stroke-width="1" opacity="0.5"/>
  <path d="M100,110 L100,130 L115,145 L115,160" fill="none" stroke="#ff00aa" stroke-width="1" opacity="0.5"/>
  <path d="M85,160 L75,170 L75,180" fill="none" stroke="#aa00ff" stroke-width="0.8" opacity="0.4"/>
  <path d="M115,160 L125,170 L125,180" fill="none" stroke="#ff00aa" stroke-width="0.8" opacity="0.4"/>
  <!-- Energy core -->
  <circle cx="100" cy="130" r="12" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.6" filter="url(#glow39)"/>
  <circle cx="100" cy="130" r="6" fill="#aa00ff" opacity="0.4"/>
  <circle cx="100" cy="130" r="3" fill="#ff00ff" opacity="0.8"/>
  <!-- Horns -->
  <path d="M80,80 L65,55 L70,78" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.6"/>
  <path d="M120,80 L135,55 L130,78" fill="none" stroke="#ff00aa" stroke-width="1.5" opacity="0.6"/>
  <!-- Power aura -->
  <circle cx="100" cy="110" r="70" fill="none" stroke="#aa00ff" stroke-width="0.3" opacity="0.2"/>
  <circle cx="100" cy="110" r="80" fill="none" stroke="#ff00ff" stroke-width="0.2" opacity="0.15"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff00ff" opacity="0.5">КИБЕР-ДРАКОН // CYBER DRAGON</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#aa00ff" opacity="0.3">NEON MERCENARIES</text>
</svg>