<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="50%" stop-color="#0a2030"/>
      <stop offset="100%" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="epoch14" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <filter id="glow14">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg14)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#epoch14)" stroke-width="1.5" opacity="0.5"/>
  <!-- Epoch master -->
  <circle cx="100" cy="90" r="35" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="90" r="25" fill="none" stroke="#00ccff" stroke-width="1" opacity="0.4"/>
  <circle cx="100" cy="90" r="15" fill="#00ffcc" opacity="0.15"/>
  <!-- Epoch markers -->
  <circle cx="100" cy="55" r="3" fill="#00ffcc" opacity="0.5"/>
  <circle cx="135" cy="90" r="3" fill="#00ccff" opacity="0.5"/>
  <circle cx="100" cy="125" r="3" fill="#00ffcc" opacity="0.5"/>
  <circle cx="65" cy="90" r="3" fill="#00ccff" opacity="0.5"/>
  <!-- Master eye -->
  <circle cx="100" cy="90" r="8" fill="#00ffcc" opacity="0.3" filter="url(#glow14)"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ffcc" opacity="0.5">МАСТЕР ЭПОХ</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#00ccff" opacity="0.3">ACKI NACKI</text>
</svg>