<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a1a"/>
      <stop offset="50%" stop-color="#0a2020"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <linearGradient id="node10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00ccaa"/>
    </linearGradient>
    <filter id="glow10">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg10)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#node10)" stroke-width="1.5" opacity="0.5"/>
  <!-- Meditative node -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#00ccaa" stroke-width="1" opacity="0.4"/>
  <circle cx="100" cy="100" r="20" fill="#00ffcc" opacity="0.1"/>
  <!-- Meditation waves -->
  <path d="M80,90 Q100,80 120,90" fill="none" stroke="#00ffcc" stroke-width="0.8" opacity="0.4"/>
  <path d="M85,100 Q100,90 115,100" fill="none" stroke="#00ccaa" stroke-width="0.8" opacity="0.3"/>
  <path d="M90,110 Q100,100 110,110" fill="none" stroke="#00ffcc" stroke-width="0.8" opacity="0.4"/>
  <!-- Zen symbol -->
  <text x="100" y="105" text-anchor="middle" font-family="serif" font-size="14" fill="#00ffcc" opacity="0.3">☯</text>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ffcc" opacity="0.5">МЕДИТАТИВНАЯ НОДА</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#00ccaa" opacity="0.3">ACKI NACKI</text>
</svg>