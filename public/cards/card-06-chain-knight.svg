<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2a"/>
      <stop offset="50%" stop-color="#1a0a3a"/>
      <stop offset="100%" stop-color="#0a0a2a"/>
    </linearGradient>
    <linearGradient id="chain6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4488ff"/>
      <stop offset="100%" stop-color="#2266cc"/>
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg6)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#chain6)" stroke-width="1.5" opacity="0.6"/>
  <!-- Knight shield with chain -->
  <path d="M100,55 L145,80 L145,140 Q145,170 100,195 Q55,170 55,140 L55,80 Z" 
        fill="none" stroke="#4488ff" stroke-width="2" opacity="0.6"/>
  <!-- Chain pattern -->
  <path d="M80,90 L120,90 M80,110 L120,110 M80,130 L120,130" stroke="#2266cc" stroke-width="1" opacity="0.4"/>
  <!-- Sword -->
  <line x1="100" y1="70" x2="100" y2="160" stroke="#4488ff" stroke-width="2" opacity="0.7"/>
  <line x1="85" y1="100" x2="115" y2="100" stroke="#4488ff" stroke-width="2" opacity="0.7"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#4488ff" opacity="0.5">РЫЦАРЬ ЦЕПИ</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#2266cc" opacity="0.3">ACKI NACKI</text>
</svg>