<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2a"/>
      <stop offset="50%" stop-color="#1a0a3a"/>
      <stop offset="100%" stop-color="#0a0a2a"/>
    </linearGradient>
    <linearGradient id="neon4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#b742ff"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg4)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#neon4)" stroke-width="1.5" opacity="0.6"/>
  <!-- Transaction arrow -->
  <path d="M60,100 L140,100" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
  <polygon points="140,100 130,90 130,110" fill="#00d4ff" opacity="0.7"/>
  <!-- Data blocks along arrow -->
  <rect x="70" y="90" width="20" height="20" rx="3" fill="none" stroke="#b742ff" stroke-width="1" opacity="0.5"/>
  <rect x="100" y="90" width="20" height="20" rx="3" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <rect x="130" y="90" width="20" height="20" rx="3" fill="none" stroke="#b742ff" stroke-width="1" opacity="0.5"/>
  <!-- Hash value -->
  <text x="100" y="85" text-anchor="middle" font-family="monospace" font-size="6" fill="#00d4ff" opacity="0.4">0x7a3f...</text>
  <!-- TX label -->
  <rect x="80" y="130" width="40" height="15" rx="3" fill="#00d4ff" opacity="0.15"/>
  <text x="100" y="141" text-anchor="middle" font-family="monospace" font-size="8" fill="#00d4ff" opacity="0.6">TX</text>
  <!-- Flow lines -->
  <path d="M60,100 Q80,80 100,100 Q120,120 140,100" fill="none" stroke="#b742ff" stroke-width="0.5" opacity="0.3"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#00d4ff" opacity="0.5">ТРАНЗАКЦИЯ</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#b742ff" opacity="0.3">ACKI NACKI</text>
</svg>