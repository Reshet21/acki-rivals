<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg24" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="50%" stop-color="#2a0a0a"/>
      <stop offset="100%" stop-color="#1a0505"/>
    </linearGradient>
    <linearGradient id="raider24" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0044"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <filter id="glow24">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg24)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#raider24)" stroke-width="1.5" opacity="0.5"/>
  <!-- Mempool raider -->
  <rect x="60" y="60" width="80" height="60" rx="6" fill="none" stroke="#ff0044" stroke-width="1.5" opacity="0.5"/>
  <text x="100" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff0044" opacity="0.4">MEMPOOL</text>
  <!-- Raider arrow -->
  <path d="M140,90 L160,90 L155,80 M160,90 L155,100" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.6"/>
  <!-- Stolen data -->
  <rect x="155" y="80" width="15" height="20" rx="2" fill="#ff0044" opacity="0.3"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff0044" opacity="0.5">РЕЙДЕР МЕМПУЛА</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff6600" opacity="0.3">ACKI NACKI</text>
</svg>