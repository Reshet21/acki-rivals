<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="50%" stop-color="#0a2030"/>
      <stop offset="100%" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="consensus15" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4488ff"/>
      <stop offset="100%" stop-color="#2266cc"/>
    </linearGradient>
    <filter id="glow15">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg15)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#consensus15)" stroke-width="1.5" opacity="0.5"/>
  <!-- Consensus guardian shield -->
  <path d="M100,55 L145,80 L145,140 Q145,170 100,195 Q55,170 55,140 L55,80 Z" 
        fill="none" stroke="#4488ff" stroke-width="2" opacity="0.6"/>
  <!-- Consensus symbol -->
  <circle cx="100" cy="110" r="25" fill="none" stroke="#2266cc" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="110" r="15" fill="#4488ff" opacity="0.1"/>
  <!-- Nodes around -->
  <circle cx="80" cy="90" r="5" fill="#4488ff" opacity="0.3"/>
  <circle cx="120" cy="90" r="5" fill="#2266cc" opacity="0.3"/>
  <circle cx="80" cy="130" r="5" fill="#2266cc" opacity="0.3"/>
  <circle cx="120" cy="130" r="5" fill="#4488ff" opacity="0.3"/>
  <!-- Connections -->
  <line x1="80" y1="90" x2="100" y2="110" stroke="#4488ff" stroke-width="0.5" opacity="0.3"/>
  <line x1="120" y1="90" x2="100" y2="110" stroke="#2266cc" stroke-width="0.5" opacity="0.3"/>
  <line x1="80" y1="130" x2="100" y2="110" stroke="#2266cc" stroke-width="0.5" opacity="0.3"/>
  <line x1="120" y1="130" x2="100" y2="110" stroke="#4488ff" stroke-width="0.5" opacity="0.3"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#4488ff" opacity="0.5">СТРАЖ КОНСЕНСУСА</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#2266cc" opacity="0.3">ACKI NACKI</text>
</svg>