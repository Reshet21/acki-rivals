<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#1a0a2a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffdd44"/>
      <stop offset="50%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ffdd44"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="circuit" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,10 L10,0" fill="none" stroke="rgba(0,212,255,0.1)" stroke-width="0.5"/>
      <path d="M10,20 L10,10 L20,10" fill="none" stroke="rgba(183,66,255,0.1)" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdd44" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff8800" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffdd44" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="280" rx="12" fill="url(#bg)"/>
  <rect width="200" height="280" rx="12" fill="url(#circuit)" opacity="0.3"/>
  
  <!-- Border -->
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
  
  <!-- Main block structure -->
  <rect x="50" y="50" width="100" height="80" rx="8" fill="none" stroke="#ffdd44" stroke-width="2.5" opacity="0.9"/>
  <rect x="55" y="55" width="90" height="70" rx="6" fill="#ffdd44" opacity="0.08"/>
  
  <!-- Inner circuit pattern -->
  <path d="M65,65 L85,65 L85,85 L105,85 L105,65 L125,65" fill="none" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
  <path d="M65,85 L75,85 L75,105 L95,105 L95,85 L115,85 L115,105 L125,105" fill="none" stroke="#ffdd44" stroke-width="1" opacity="0.3"/>
  <path d="M65,105 L85,105 L85,115 L105,115 L105,105 L125,105" fill="none" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
  
  <!-- Central node with glow -->
  <circle cx="100" cy="90" r="15" fill="url(#node-glow)" filter="url(#glow-strong)"/>
  <circle cx="100" cy="90" r="8" fill="#ffdd44" opacity="0.9"/>
  <circle cx="100" cy="90" r="4" fill="#ffffff" opacity="0.8"/>
  
  <!-- Energy connections -->
  <line x1="100" y1="90" x2="65" y2="65" stroke="#ffdd44" stroke-width="0.8" opacity="0.5"/>
  <line x1="100" y1="90" x2="135" y2="65" stroke="#ff8800" stroke-width="0.8" opacity="0.5"/>
  <line x1="100" y1="90" x2="65" y2="115" stroke="#ff8800" stroke-width="0.8" opacity="0.5"/>
  <line x1="100" y1="90" x2="135" y2="115" stroke="#ffdd44" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Block header -->
  <rect x="50" y="45" width="100" height="8" rx="2" fill="#ffdd44" opacity="0.3"/>
  <text x="100" y="52" text-anchor="middle" font-family="monospace" font-size="6" fill="#ffdd44" opacity="0.9" font-weight="bold">BLOCK #001</text>
  
  <!-- Hash value -->
  <text x="100" y="145" text-anchor="middle" font-family="monospace" font-size="5" fill="#ff8800" opacity="0.4">0x7a3f...8b2e</text>
  
  <!-- Chain links below -->
  <path d="M100,130 L100,150 L90,160 L100,170 L110,160 L100,150" fill="none" stroke="#ffdd44" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Energy particles -->
  <circle cx="60" cy="60" r="1.5" fill="#ffdd44" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="70" r="1" fill="#ff8800" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="55" cy="120" r="1.2" fill="#ffdd44" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="145" cy="110" r="1" fill="#ff8800" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Label -->
  <text x="100" y="220" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffdd44" opacity="0.8" font-weight="bold">МАЛЫЙ БЛОК</text>
  <text x="100" y="235" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff8800" opacity="0.5">ACKI NACKI</text>
  
  <!-- Rarity indicator -->
  <rect x="70" y="245" width="60" height="12" rx="3" fill="#ffdd44" opacity="0.15"/>
  <text x="100" y="254" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffdd44" opacity="0.7">COMMON</text>
</svg>