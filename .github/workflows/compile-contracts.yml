name: Compile Smart Contracts

on:
  push:
    branches: [main]
    paths:
      - 'contracts/*.sol'
      - '.github/workflows/compile-contracts.yml'
  workflow_dispatch:

env:
  SOLD_TAG: "0.77.0"         # тег релиза (с точками)
  SOLD_FILES: "0_77_0"       # имена ассетов (с подчёркиваниями)

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gzip

      - name: Download pre-built sold + stdlib
        run: |
          set -euo pipefail
          mkdir -p tools

          # Download sold binary
          echo "⬇️ Downloading sold $SOLD_TAG..."
          curl -sL \
            "https://github.com/everx-labs/TVM-Solidity-Compiler/releases/download/${SOLD_TAG}/sold_${SOLD_FILES}_linux.gz" \
            -o /tmp/sold.gz
          gunzip /tmp/sold.gz
          chmod +x /tmp/sold
          mv /tmp/sold tools/sold
          echo "✅ sold: $(./tools/sold --version 2>&1)"

          # Download stdlib_sol.tvm
          echo "⬇️ Downloading stdlib_sol.tvm..."
          curl -sL \
            "https://github.com/everx-labs/TVM-Solidity-Compiler/releases/download/${SOLD_TAG}/stdlib_sol_${SOLD_FILES}.tvm.gz" \
            -o /tmp/stdlib_sol.tvm.gz
          gunzip -c /tmp/stdlib_sol.tvm.gz > tools/stdlib_sol.tvm
          echo "✅ stdlib_sol.tvm: $(wc -c < tools/stdlib_sol.tvm) bytes"

          echo "tools/" >> $GITHUB_PATH

      - name: Compile all contracts
        run: |
          set -euo pipefail
          export PATH="$PWD/tools:$PATH"
          mkdir -p build

          SOLD="$PWD/tools/sold"

          echo "sold version: $($SOLD --version 2>&1)"

          # interfaces.sol не компилируем отдельно —
          # он импортируется другими контрактами через `--contract`
          CONTRACTS=(
            contracts/GameCardNFTToken.sol
            contracts/GameCardNFTCollection.sol
            contracts/GameMatch.sol
          # TODO: PvPStaking.sol, Marketplace.sol — будут в B5/B6
          )

          for SRC in "${CONTRACTS[@]}"; do
            NAME="$(basename "$SRC" .sol)"
            echo ""
            echo "📦 Compiling $NAME..."

            $SOLD \
              --tvm-version gosh \
              --output-dir "$PWD/build" \
              --contract "$NAME" \
              "$SRC" || {
              echo "❌ $NAME.sol compilation failed"
              exit 1
            }

            echo "✅ $NAME compiled"
          done

          echo ""
          echo "🎉 All contracts compiled successfully!"

      - name: List artifacts
        run: |
          echo "=== build/ artifacts ==="
          ls -lh build/

      - name: Smoke test
        run: |
          set -euo pipefail
          ERROR=0
          echo "=== Smoke tests ==="
          for F in build/*.code; do
            [ -f "$F" ] || continue
            SIZE=$(stat --format="%s" "$F")
            if [ "$SIZE" -gt 100 ]; then
              echo "✅ $(basename $F): ${SIZE} bytes"
            else
              echo "❌ $(basename $F): too small ${SIZE} bytes"
              ERROR=1
            fi
          done
          for F in build/*.abi.json; do
            [ -f "$F" ] || continue
            echo "📄 $(basename $F): $(wc -c < "$F") bytes"
          done
          # Must have at least GameCardNFTToken.code
          if [ ! -f "build/GameCardNFTToken.code" ]; then
            echo "❌ GameCardNFTToken.code missing!"
            ERROR=1
          fi
          [ "$ERROR" -eq 0 ] || exit 1
          echo "🎉 All checks passed!"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contracts
          path: build/
          retention-days: 90
