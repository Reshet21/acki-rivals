<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg31" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="50%" stop-color="#2a1a00"/>
      <stop offset="100%" stop-color="#1a0a00"/>
    </linearGradient>
    <linearGradient id="poison31" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <filter id="glow31">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg31)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#poison31)" stroke-width="1.5" opacity="0.5"/>
  <!-- Mempool poisoner -->
  <rect x="60" y="60" width="80" height="60" rx="6" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.5"/>
  <text x="100" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffaa00" opacity="0.4">MEMPOOL</text>
  <!-- Poison drops -->
  <circle cx="85" cy="130" r="5" fill="#ffaa00" opacity="0.4" filter="url(#glow31)"/>
  <circle cx="100" cy="140" r="4" fill="#ff6600" opacity="0.3"/>
  <circle cx="115" cy="130" r="5" fill="#ffaa00" opacity="0.4" filter="url(#glow31)"/>
  <!-- Skull -->
  <circle cx="100" cy="155" r="8" fill="none" stroke="#ffaa00" stroke-width="1" opacity="0.4"/>
  <circle cx="96" cy="153" r="1.5" fill="#ffaa00" opacity="0.5"/>
  <circle cx="104" cy="153" r="1.5" fill="#ff6600" opacity="0.5"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffaa00" opacity="0.5">ОТРАВИТЕЛЬ МЕМПУЛА</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff6600" opacity="0.3">ACKI NACKI</text>
</svg>