<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg26" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#1a0a2a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="killer26" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0044"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <filter id="glow26">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg26)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#killer26)" stroke-width="1.5" opacity="0.5"/>
  <!-- Node killer -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#ff0044" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="100" r="25" fill="none" stroke="#ff6600" stroke-width="1" opacity="0.4"/>
  <!-- Crosshair -->
  <line x1="100" y1="65" x2="100" y2="135" stroke="#ff0044" stroke-width="1" opacity="0.5"/>
  <line x1="65" y1="100" x2="135" y2="100" stroke="#ff0044" stroke-width="1" opacity="0.5"/>
  <!-- Kill target -->
  <circle cx="100" cy="100" r="10" fill="#ff0044" opacity="0.3" filter="url(#glow26)"/>
  <circle cx="100" cy="100" r="5" fill="#ff0044" opacity="0.6"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff0044" opacity="0.5">УБИЙЦА НОД</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff6600" opacity="0.3">ACKI NACKI</text>
</svg>