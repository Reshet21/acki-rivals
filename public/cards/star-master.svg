<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="mbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2e1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a4a2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="mblade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a0f0c0"/>
      <stop offset="100%" style="stop-color:#20a060"/>
    </linearGradient>
    <filter id="mglow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="mglow2"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" fill="url(#mbg)"/>
  <!-- Zen circles -->
  <g stroke="#10b981" stroke-width="0.5" opacity="0.12" fill="none">
    <circle cx="100" cy="100" r="60"/><circle cx="100" cy="100" r="45"/><circle cx="100" cy="100" r="30"/>
  </g>
  <!-- Monk figure -->
  <g transform="translate(100,100)" filter="url(#mglow)">
    <!-- Robe -->
    <path d="M-25,40 L-35,80 L0,90 L35,80 L25,40 Z" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <path d="M-20,20 L-25,40 L25,40 L20,20 Z" fill="#047857" stroke="#10b981" stroke-width="1"/>
    <!-- Head -->
    <circle cx="0" cy="-5" r="18" fill="#d4a574" stroke="#b8860b" stroke-width="1"/>
    <!-- Eyes (closed - meditating) -->
    <path d="M-7,-7 Q-5,-9 -3,-7" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
    <path d="M3,-7 Q5,-9 7,-7" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
    <!-- Halo -->
    <ellipse cx="0" cy="-20" rx="20" ry="5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6" filter="url(#mglow)"/>
    <!-- Hands in meditation -->
    <ellipse cx="-20" cy="30" rx="8" ry="6" fill="#d4a574"/>
    <ellipse cx="20" cy="30" rx="8" ry="6" fill="#d4a574"/>
    <!-- Energy orbs -->
    <circle cx="-22" cy="28" r="5" fill="#10b981" opacity="0.6" filter="url(#mglow2)"/>
    <circle cx="22" cy="28" r="5" fill="#10b981" opacity="0.6" filter="url(#mglow2)"/>
    <!-- Floating symbols -->
    <text x="0" y="-40" text-anchor="middle" font-size="14" fill="#10b981" opacity="0.4" filter="url(#mglow)">☸</text>
  </g>
  <!-- Name plate -->
  <rect x="30" y="155" width="140" height="20" rx="4" fill="rgba(0,0,0,0.5)" stroke="#10b981" stroke-width="0.5"/>
  <text x="100" y="168" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="10" fill="#d0fff0">ЗВЁЗДНЫЙ МАСТЕР</text>
</svg>