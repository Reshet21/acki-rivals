  <circle cx="110" cy="158" r="3" fill="#00cc44" opacity="0.25"/>
  <circle cx="100" cy="170" r="2.5" fill="#00ff66" opacity="0.35"/>
  <circle cx="85" cy="152" r="2" fill="#00cc44" opacity="0.2"/>
  <!-- Vapor -->
  <path d="M90,85 Q85,70 90,55" fill="none" stroke="#00ff66" stroke-width="0.8" opacity="0.3"/>
  <path d="M100,83 Q95,65 100,50" fill="none" stroke="#00cc44" stroke-width="0.8" opacity="0.25"/>
  <path d="M110,85 Q115,70 110,55" fill="none" stroke="#00ff66" stroke-width="0.8" opacity="0.3"/>
  <!-- Molecule symbols -->
  <circle cx="45" cy="110" r="5" fill="none" stroke="#00ff66" stroke-width="0.8" opacity="0.3"/>
  <circle cx="55" cy="105" r="3" fill="none" stroke="#00cc44" stroke-width="0.6" opacity="0.25"/>
  <line x1="50" y1="108" x2="52" y2="106" stroke="#00ff66" stroke-width="0.6" opacity="0.3"/>
  <circle cx="155" cy="120" r="5" fill="none" stroke="#00cc44" stroke-width="0.8" opacity="0.3"/>
  <circle cx="165" cy="115" r="3" fill="none" stroke="#00ff66" stroke-width="0.6" opacity="0.25"/>
  <line x1="160" y1="118" x2="162" y2="116" stroke="#00cc44" stroke-width="0.6" opacity="0.3"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff66" opacity="0.5">АЛХИМИК // ALCHEMIST</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#00cc44" opacity="0.3">DIGITAL MONKS</text>
