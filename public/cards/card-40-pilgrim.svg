<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg40" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a1a"/>
      <stop offset="50%" stop-color="#0a2020"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <linearGradient id="teal40" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00ccaa"/>
    </linearGradient>
    <filter id="glow40">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg40)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#teal40)" stroke-width="1.5" opacity="0.5"/>
  <!-- Path/road -->
  <path d="M100,200 Q80,170 90,140 Q100,110 100,80" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
  <!-- Footsteps -->
  <ellipse cx="95" cy="180" rx="4" ry="6" fill="#00ffcc" opacity="0.2"/>
  <ellipse cx="105" cy="165" rx="4" ry="6" fill="#00ffcc" opacity="0.25"/>
  <ellipse cx="95" cy="150" rx="4" ry="6" fill="#00ffcc" opacity="0.3"/>
  <ellipse cx="105" cy="135" rx="4" ry="6" fill="#00ffcc" opacity="0.35"/>
  <!-- Temple silhouette -->
  <path d="M80,90 L100,65 L120,90 Z" fill="none" stroke="#00ccaa" stroke-width="1" opacity="0.5"/>
  <rect x="88" y="90" width="24" height="15" fill="none" stroke="#00ccaa" stroke-width="0.8" opacity="0.4"/>
  <rect x="95" y="95" width="10" height="10" fill="#00ffcc" opacity="0.1"/>
  <!-- Glow from temple -->
  <circle cx="100" cy="78" r="15" fill="#00ffcc" opacity="0.08" filter="url(#glow40)"/>
  <!-- Mist -->
  <ellipse cx="70" cy="120" rx="30" ry="8" fill="#00ffcc" opacity="0.06"/>
  <ellipse cx="130" cy="130" rx="25" ry="6" fill="#00ccaa" opacity="0.05"/>
  <!-- Stars -->
  <circle cx="40" cy="50" r="1" fill="#00ffcc" opacity="0.4"/>
  <circle cx="160" cy="45" r="1" fill="#00ccaa" opacity="0.3"/>
  <circle cx="55" cy="35" r="0.8" fill="#00ffcc" opacity="0.3"/>
  <circle cx="145" cy="60" r="0.8" fill="#00ccaa" opacity="0.3"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ffcc" opacity="0.5">ПАЛОМНИК // PILGRIM</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#00ccaa" opacity="0.3">DIGITAL MONKS</text>
</svg>