<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg42" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="50%" stop-color="#0a2030"/>
      <stop offset="100%" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="keeper42" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4488ff"/>
      <stop offset="100%" stop-color="#2266cc"/>
    </linearGradient>
    <filter id="glow42">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg42)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#keeper42)" stroke-width="1.5" opacity="0.5"/>
  <!-- Chain keeper -->
  <path d="M100,55 L145,80 L145,140 Q145,170 100,195 Q55,170 55,140 L55,80 Z" 
        fill="none" stroke="#4488ff" stroke-width="2" opacity="0.6"/>
  <!-- Chain pattern inside shield -->
  <path d="M80,90 L120,90 M80,110 L120,110 M80,130 L120,130" stroke="#2266cc" stroke-width="1" opacity="0.4"/>
  <!-- Lock symbol -->
  <rect x="90" y="100" width="20" height="15" rx="3" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M95,100 L95,95 Q95,85 100,85 Q105,85 105,95 L105,100" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#4488ff" opacity="0.5">ХРАНИТЕЛЬ ЦЕПИ</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#2266cc" opacity="0.3">ACKI NACKI</text>
</svg>