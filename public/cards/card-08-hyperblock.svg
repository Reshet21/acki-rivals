<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0020"/>
      <stop offset="50%" stop-color="#200040"/>
      <stop offset="100%" stop-color="#0a0020"/>
    </linearGradient>
    <linearGradient id="hyper8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="50%" stop-color="#aa00ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="glow8">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg8)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#hyper8)" stroke-width="2.5" opacity="0.8"/>
  <!-- Hyperblock - massive block with energy -->
  <rect x="50" y="50" width="100" height="80" rx="8" fill="none" stroke="#ff00ff" stroke-width="3" opacity="0.9" filter="url(#glow8)"/>
  <rect x="55" y="55" width="90" height="70" rx="6" fill="#ff00ff" opacity="0.1"/>
  <!-- Energy core -->
  <circle cx="100" cy="90" r="25" fill="none" stroke="#aa00ff" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="90" r="15" fill="#ff00ff" opacity="0.3" filter="url(#glow8)"/>
  <circle cx="100" cy="90" r="8" fill="#ffffff" opacity="0.8"/>
  <!-- Lightning bolts -->
  <path d="M75,70 L85,85 L80,90 L95,110" fill="none" stroke="#ff00aa" stroke-width="1.5" opacity="0.7"/>
  <path d="M125,70 L115,85 L120,90 L105,110" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.7"/>
  <!-- Power rings -->
  <circle cx="100" cy="90" r="40" fill="none" stroke="#ff00ff" stroke-width="0.5" opacity="0.3"/>
  <circle cx="100" cy="90" r="50" fill="none" stroke="#aa00ff" stroke-width="0.3" opacity="0.2"/>
  <!-- HYPER text -->
  <text x="100" y="155" text-anchor="middle" font-family="monospace" font-size="14" fill="#ff00ff" opacity="0.6" filter="url(#glow8)">HYPER</text>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="12" fill="#ff00ff" opacity="0.5">ГИПЕРБЛОК</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#aa00ff" opacity="0.3">LEGENDARY • ACKI NACKI</text>
</svg>