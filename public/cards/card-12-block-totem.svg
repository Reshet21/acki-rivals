<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#1a0a2a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="totem12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ff4400"/>
    </linearGradient>
    <filter id="glow12">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg12)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#totem12)" stroke-width="1.5" opacity="0.5"/>
  <!-- Block totem -->
  <rect x="80" y="50" width="40" height="30" rx="4" fill="none" stroke="#ff8800" stroke-width="1.5" opacity="0.5"/>
  <rect x="85" y="85" width="30" height="25" rx="3" fill="none" stroke="#ff4400" stroke-width="1.5" opacity="0.5"/>
  <rect x="82" y="115" width="36" height="28" rx="4" fill="none" stroke="#ff8800" stroke-width="1.5" opacity="0.5"/>
  <!-- Totem face -->
  <circle cx="95" cy="130" r="3" fill="#ff8800" opacity="0.5"/>
  <circle cx="105" cy="130" r="3" fill="#ff4400" opacity="0.5"/>
  <path d="M90,140 Q100,145 110,140" fill="none" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff8800" opacity="0.5">ТОТЕМ БЛОКА</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff4400" opacity="0.3">ACKI NACKI</text>
</svg>