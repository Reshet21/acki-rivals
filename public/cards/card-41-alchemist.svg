  <rect x="80" y="85" width="40" height="8" rx="2" fill="none" stroke="#00ff66" stroke-width="1" opacity="0.5"/>
  <!-- Liquid -->
  <path d="M70,155 Q85,148 100,155 Q115,162 130,155 L135,160 Q140,175 125,180 L75,180 Q60,175 65,160 Z" 
