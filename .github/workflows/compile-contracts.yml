name: Compile Smart Contracts

on:
  push:
    branches: [main]
    paths:
      - 'contracts/*.sol'
      - '.github/workflows/compile-contracts.yml'
  workflow_dispatch:
    inputs:
      deploy_to_shellnet:
        description: 'Deploy to Shellnet after compile?'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            cmake \
            libboost-all-dev \
            libfmt-dev \
            libjsoncpp-dev \
            librange-v3-dev \
            ninja-build \
            xxd \
            file \
            gzip

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build sold + tvm_linker
        run: |
          set -euo pipefail

          git clone --depth 1 --recurse-submodules \
            https://github.com/everx-labs/TVM-Solidity-Compiler.git

          echo "=== Building sold ==="
          cd TVM-Solidity-Compiler/sold
          cargo build --release
          echo "✅ sold build complete"

          echo "=== Building tvm_linker ==="
          cd ../tvm_linker
          cargo build --release
          echo "✅ tvm_linker build complete"

          cd ../../

      - name: Compile all contracts with sold
        run: |
          set -euo pipefail
          mkdir -p build

          # Find sold binary
          SOLD=$(find . -name "sold" -path "*/release/*" -type f 2>/dev/null | head -1)
          if [ -z "$SOLD" ]; then
            echo "❌ sold binary not found!"
            find . -name "sold" -type f 2>/dev/null | head -5
            exit 1
          fi
          echo "Using sold: $SOLD"
          $SOLD --version

          # Find tvm_linker binary
          TVM_LINKER=$(find . -name "tvm_linker" -path "*/release/*" -type f 2>/dev/null | head -1)
          if [ -z "$TVM_LINKER" ]; then
            echo "❌ tvm_linker binary not found!"
            find . -name "tvm_linker" -type f 2>/dev/null | head -5
            exit 1
          fi
          echo "Using tvm_linker: $TVM_LINKER"

          # Find stdlib_sol.tvm (from the tvm_linker or sold sources)
          STDLIB=$(find . -name "stdlib_sol.tvm" -type f 2>/dev/null | head -1)
          if [ -z "$STDLIB" ]; then
            echo "⚠️  stdlib_sol.tvm not found, trying to locate in build dirs..."
            # It could be embedded in tvm_linker binary or elsewhere
            find . -name "*.tvm" -type f 2>/dev/null | head -10
          fi
          echo "Using stdlib: ${STDLIB:-<embedded or not found>}"

          # Compile interfaces first (imported by everything)
          echo "📦 Compiling interfaces.sol..."
          $SOLD \
            --tvm-version gosh \
            --output-dir build/ \
            --contract contracts/interfaces.sol \
            contracts/interfaces.sol || {
            echo '❌ interfaces.sol failed'
            exit 1
          }

          # Compile each contract
          CONTRACTS=(
            GameCardNFTToken
            GameCardNFTCollection
            GameMatch
            PvPStaking
            Marketplace
          )

          for CONTRACT in "${CONTRACTS[@]}"; do
            SRC="contracts/${CONTRACT}.sol"
            if [ ! -f "$SRC" ]; then
              echo "⚠️  Skipping ${SRC} — not found"
              continue
            fi

            echo "📦 Compiling ${CONTRACT}..."
            $SOLD \
              --tvm-version gosh \
              --output-dir build/ \
              --contract contracts/interfaces.sol \
              "${SRC}" || {
              echo "❌ Failed to compile ${CONTRACT}"
              exit 1
            }

            # Link .code → .tvc if stdlib found
            CODE="build/${CONTRACT}.code"
            ABI="build/${CONTRACT}.abi.json"
            if [ -f "$CODE" ] && [ -n "$STDLIB" ]; then
              echo "🔗 Linking ${CONTRACT}.code → .tvc..."
              $TVM_LINKER compile "$CODE" \
                --abi "$ABI" \
                --lib "$STDLIB" \
                -o "build/${CONTRACT}.tvc" || {
                echo "⚠️  tvm_linker failed for ${CONTRACT}, trying without --lib..."
                $TVM_LINKER compile "$CODE" \
                  --abi "$ABI" \
                  -o "build/${CONTRACT}.tvc" || {
                  echo "❌ tvm_linker also failed without --lib for ${CONTRACT}"
                  # Non-fatal — .code still usable
                }
              }
            elif [ -f "$CODE" ]; then
              echo "🔗 Linking ${CONTRACT} without stdlib..."
              $TVM_LINKER compile "$CODE" \
                --abi "$ABI" \
                -o "build/${CONTRACT}.tvc" || {
                echo "⚠️  tvm_linker failed for ${CONTRACT} (non-fatal)"
              }
            fi
          done

          echo "=== Compilation step complete ==="

      - name: Collect artifacts
        run: |
          set -euo pipefail
          echo "=== build/ contents ==="
          ls -la build/ 2>/dev/null || echo "(empty)"

          echo "=== Copy any missed artifacts to build/ ==="
          find . \( -name "*.tvc" -o -name "*.code" -o -name "*.abi.json" -o -name "*.debug.json" \) \
            -type f -not -path "./build/*" -not -path "./TVM-Solidity-Compiler/*" \
            -exec cp -v {} build/ \; 2>/dev/null || true

          echo "=== Final build/ contents ==="
          ls -la build/

      - name: Smoke test — verify .tvc and .abi
        run: |
          set -euo pipefail
          echo "=== Smoke tests ==="
          ERROR=0

          # Check .tvc files
          TVC_COUNT=0
          for F in build/*.tvc; do
            if [ -f "$F" ]; then
              SIZE=$(stat --format="%s" "$F")
              if [ "$SIZE" -gt 500 ]; then
                FT=$(file -b "$F")
                echo "✅ $(basename $F): ${SIZE} bytes (${FT%% *})"
                TVC_COUNT=$((TVC_COUNT + 1))
              else
                echo "❌ $(basename $F): too small (${SIZE} bytes), possible corrupt"
                ERROR=1
              fi
            fi
          done

          # Check .abi.json files
          ABI_COUNT=0
          for F in build/*.abi.json; do
            if [ -f "$F" ]; then
              SIZE=$(stat --format="%s" "$F")
              echo "📄 $(basename $F): ${SIZE} bytes"
              ABI_COUNT=$((ABI_COUNT + 1))
            fi
          done

          echo ""
          echo "=== Summary ==="
          echo "TVC files: ${TVC_COUNT}"
          echo "ABI files: ${ABI_COUNT}"
          echo ""

          # Critical: GameCardNFTCollection must have .tvc for deploy
          if [ ! -f "build/GameCardNFTCollection.tvc" ]; then
            echo "⚠️  GameCardNFTCollection.tvc missing! Checking .code..."
          fi
          if [ ! -f "build/GameCardNFTCollection.abi.json" ]; then
            echo "❌ GameCardNFTCollection.abi.json missing!"
            ERROR=1
          fi

          [ "$ERROR" -eq 0 ] || exit 1

      - name: Generate SHA256 checksums
        run: |
          cd build
          sha256sum * > checksums.sha256 2>/dev/null || true
          cat checksums.sha256 2>/dev/null || echo "(no files)"

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contracts
          path: build/
          retention-days: 90

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_shellnet }}
    needs: compile
    runs-on: ubuntu-latest
    environment: shellnet
    steps:
      - name: Download compiled artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-contracts
          path: build/

      - name: Setup tvm-cli
        run: |
          curl -sL \
            https://github.com/everx-labs/ever-cli/releases/latest/download/ever-cli-linux.gz \
            | gunzip > tvm-cli
          chmod +x tvm-cli
          sudo mv tvm-cli /usr/local/bin/
          tvm-cli --version

      - name: Configure Shellnet
        run: |
          tvm-cli config -g --url shellnet.ackinacki.org

      - name: Get test tokens from Giver
        run: |
          echo "Получаем тестовые токены для адреса деплоя..."
          echo "После деплоя можно запросить SHELL:"
          echo "  tvm-cli call --abi <giver-abi> <giver-address> sendGrams '{\"dest\":\"<ADDR>\",\"amount\":10}'"
          echo "Ссылка: https://dev.ackinacki.com/readme/get-test-tokens-in-shellnet"

      - name: Deploy Collection
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          OWNER_PUBKEY: ${{ secrets.OWNER_PUBKEY }}
        run: |
          echo "$DEPLOY_KEY" > deploy.keys.json
          tvm-cli deploy \
            --abi build/GameCardNFTCollection.abi.json \
            --sign deploy.keys.json \
            build/GameCardNFTCollection.tvc \
            "{\"_ownerPubkey\": \"0x${OWNER_PUBKEY}\", \"_admin\": \"${{ secrets.ADMIN_ADDRESS }}\"}" \
            --value 1.0
