<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="50%" stop-color="#0a2030"/>
      <stop offset="100%" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="cosmic18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#00ccff"/>
      <stop offset="100%" stop-color="#00ffaa"/>
    </linearGradient>
    <filter id="glow18">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg18)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#cosmic18)" stroke-width="1.5" opacity="0.6"/>
  <!-- Cosmic validator -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.4"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#00ccff" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="100" r="30" fill="#00ffcc" opacity="0.1"/>
  <!-- Validation check -->
  <path d="M85,100 L95,110 L115,90" fill="none" stroke="#00ffcc" stroke-width="2" opacity="0.7" filter="url(#glow18)"/>
  <!-- Stars -->
  <circle cx="60" cy="60" r="1" fill="#00ffcc" opacity="0.4"/>
  <circle cx="140" cy="50" r="1" fill="#00ccff" opacity="0.3"/>
  <circle cx="50" cy="140" r="0.8" fill="#00ffaa" opacity="0.3"/>
  <circle cx="150" cy="130" r="0.8" fill="#00ffcc" opacity="0.3"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ffcc" opacity="0.5">КОСМИЧЕСКИЙ ВАЛИДАТОР</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#00ccff" opacity="0.3">EPIC • ACKI NACKI</text>
</svg>