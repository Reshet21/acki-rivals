<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg34" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="50%" stop-color="#0a2a10"/>
      <stop offset="100%" stop-color="#0a1a0a"/>
    </linearGradient>
    <linearGradient id="buddha34" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc44"/>
    </linearGradient>
    <filter id="glow34">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg34)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#buddha34)" stroke-width="2" opacity="0.7"/>
  <!-- Buddha silhouette with blockchain -->
  <ellipse cx="100" cy="90" rx="35" ry="30" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
  <!-- Meditation pose -->
  <path d="M80,100 Q100,120 120,100" fill="none" stroke="#00cc44" stroke-width="1.5" opacity="0.5"/>
  <!-- Halo of blocks -->
  <rect x="75" y="55" width="10" height="10" rx="2" fill="#00ff88" opacity="0.3"/>
  <rect x="95" y="50" width="10" height="10" rx="2" fill="#00cc44" opacity="0.3"/>
  <rect x="115" y="55" width="10" height="10" rx="2" fill="#00ff88" opacity="0.3"/>
  <!-- Third eye (blockchain eye) -->
  <circle cx="100" cy="80" r="8" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.6"/>
  <circle cx="100" cy="80" r="4" fill="#00ff88" opacity="0.5" filter="url(#glow34)"/>
  <!-- Chain links around -->
  <circle cx="100" cy="90" r="45" fill="none" stroke="#00cc44" stroke-width="0.5" opacity="0.3" stroke-dasharray="5,5"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff88" opacity="0.5">БУДДА БЛОКЧЕЙНА</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#00cc44" opacity="0.3">LEGENDARY • ACKI NACKI</text>
</svg>