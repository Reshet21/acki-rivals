<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg32" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="50%" stop-color="#0a2030"/>
      <stop offset="100%" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="genesis32" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#00ccff"/>
      <stop offset="100%" stop-color="#00ffaa"/>
    </linearGradient>
    <filter id="glow32">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg32)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#genesis32)" stroke-width="1.5" opacity="0.6"/>
  <!-- Genesis block spirit -->
  <rect x="70" y="60" width="60" height="50" rx="6" fill="none" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <text x="100" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ffcc" opacity="0.5">GENESIS</text>
  <!-- Spirit aura -->
  <circle cx="100" cy="85" r="40" fill="none" stroke="#00ffcc" stroke-width="0.5" opacity="0.3" filter="url(#glow32)"/>
  <circle cx="100" cy="85" r="50" fill="none" stroke="#00ccff" stroke-width="0.3" opacity="0.2"/>
  <!-- Chain from genesis -->
  <path d="M100,110 L100,140 L90,150 L100,160 L110,150 L100,140" fill="none" stroke="#00ffaa" stroke-width="1" opacity="0.4"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ffcc" opacity="0.5">ДУХ ГЕНЕЗИСА</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#00ccff" opacity="0.3">ACKI NACKI</text>
</svg>