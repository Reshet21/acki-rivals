<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg29" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="50%" stop-color="#0a2030"/>
      <stop offset="100%" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="epoch29" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4488ff"/>
      <stop offset="100%" stop-color="#2266cc"/>
    </linearGradient>
    <filter id="glow29">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg29)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#epoch29)" stroke-width="1.5" opacity="0.5"/>
  <!-- Epoch guardian -->
  <circle cx="100" cy="90" r="35" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="90" r="25" fill="none" stroke="#2266cc" stroke-width="1" opacity="0.4"/>
  <!-- Shield in center -->
  <path d="M100,75 L120,85 L120,105 Q120,115 100,120 Q80,115 80,105 L80,85 Z" 
        fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Time markers -->
  <circle cx="100" cy="55" r="2" fill="#4488ff" opacity="0.4"/>
  <circle cx="135" cy="90" r="2" fill="#2266cc" opacity="0.4"/>
  <circle cx="100" cy="125" r="2" fill="#4488ff" opacity="0.4"/>
  <circle cx="65" cy="90" r="2" fill="#2266cc" opacity="0.4"/>
  <!-- Label -->
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#4488ff" opacity="0.5">СТРАЖ ЭПОХИ</text>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#2266cc" opacity="0.3">ACKI NACKI</text>
</svg>