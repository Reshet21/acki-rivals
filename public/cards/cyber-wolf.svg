<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a3e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3d1a6e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0"/>
      <stop offset="50%" style="stop-color:#b0b0b0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
    <linearGradient id="energy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#b742ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-strong"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Circuit lines -->
  <g stroke="#00d4ff" stroke-width="0.5" opacity="0.15" fill="none">
    <path d="M20,100 L60,100 L80,70 L120,70"/><path d="M180,100 L140,100 L120,130"/>
    <path d="M100,20 L100,60 L70,80"/><path d="M100,180 L100,140 L130,120"/>
  </g>
  <!-- Wolf body -->
  <g transform="translate(100,95)" filter="url(#glow)">
    <!-- Body -->
    <ellipse cx="0" cy="10" rx="35" ry="25" fill="#2d1b69" stroke="#7c3aed" stroke-width="1.5"/>
    <!-- Head -->
    <ellipse cx="0" cy="-20" rx="22" ry="18" fill="#3d2b7a" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Eyes -->
    <ellipse cx="-8" cy="-22" rx="4" ry="3" fill="#00d4ff" filter="url(#glow)"/>
    <ellipse cx="8" cy="-22" rx="4" ry="3" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="-8" cy="-22" r="1.5" fill="#fff"/>
    <circle cx="8" cy="-22" r="1.5" fill="#fff"/>
    <!-- Ears -->
    <polygon points="-15,-35 -8,-20 -20,-25" fill="#4c1d95" stroke="#7c3aed" stroke-width="1"/>
    <polygon points="15,-35 8,-20 20,-25" fill="#4c1d95" stroke="#7c3aed" stroke-width="1"/>
    <!-- Snout -->
    <ellipse cx="0" cy="-15" rx="8" ry="5" fill="#2d1b69"/>
    <ellipse cx="0" cy="-16" rx="3" ry="2" fill="#1a0a3e"/>
    <!-- Cyber implants -->
    <rect x="-25" y="0" width="8" height="3" rx="1" fill="#00d4ff" opacity="0.8" filter="url(#glow)"/>
    <rect x="17" y="0" width="8" height="3" rx="1" fill="#00d4ff" opacity="0.8" filter="url(#glow)"/>
    <!-- Claws -->
    <path d="M-30,25 L-38,35 M-28,27 L-35,38 M-26,28 L-32,37" stroke="#b742ff" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M30,25 L38,35 M28,27 L35,38 M26,28 L32,37" stroke="#b742ff" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Energy lines -->
    <line x1="-30" y1="-10" x2="-45" y2="-20" stroke="url(#energy)" stroke-width="1" opacity="0.6" filter="url(#glow)"/>
    <line x1="30" y1="-10" x2="45" y2="-20" stroke="url(#energy)" stroke-width="1" opacity="0.6" filter="url(#glow)"/>
  </g>
  <!-- Name plate -->
  <rect x="30" y="155" width="140" height="20" rx="4" fill="rgba(0,0,0,0.5)" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="100" y="168" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="10" fill="#e0e0ff">КИБЕР-ВОЛК</text>
</svg>