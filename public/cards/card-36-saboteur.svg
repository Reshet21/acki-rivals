<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg36" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="50%" stop-color="#2a0a0a"/>
      <stop offset="100%" stop-color="#1a0505"/>
    </linearGradient>
    <linearGradient id="neon36" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0044"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <filter id="glow36">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" rx="12" fill="url(#bg36)"/>
  <rect x="2" y="2" width="196" height="276" rx="10" fill="none" stroke="url(#neon36)" stroke-width="1.5" opacity="0.6"/>
  <!-- Circuit board pattern -->
  <path d="M40,80 L80,80 L80,100 L120,100 L120,80 L160,80" fill="none" stroke="#ff0044" stroke-width="1" opacity="0.4"/>
  <path d="M40,120 L60,120 L60,140 L100,140 L100,120 L140,120 L140,140 L160,140" fill="none" stroke="#ff6600" stroke-width="1" opacity="0.3"/>
  <path d="M40,160 L80,160 L80,180 L120,180 L120,160 L160,160" fill="none" stroke="#ff0044" stroke-width="1" opacity="0.4"/>
  <!-- Explosion center -->
  <circle cx="100" cy="130" r="25" fill="none" stroke="#ff0044" stroke-width="1.5" opacity="0.6" filter="url(#glow36)"/>
  <circle cx="100" cy="130" r="15" fill="none" stroke="#ff6600" stroke-width="1" opacity="0.8"/>
  <circle cx="100" cy="130" r="5" fill="#ff0044" opacity="0.9" filter="url(#glow36)"/>
  <!-- Sparks -->
  <line x1="100" y1="130" x2="130" y2="100" stroke="#ffaa00" stroke-width="1" opacity="0.6"/>
  <line x1="100" y1="130" x2="70" y2="160" stroke="#ffaa00" stroke-width="1" opacity="0.6"/>
  <line x1="100" y1="130" x2="130" y2="160" stroke="#ff0044" stroke-width="0.8" opacity="0.5"/>
  <line x1="100" y1="130" x2="70" y2="100" stroke="#ff0044" stroke-width="0.8" opacity="0.5"/>
  <!-- Data nodes -->
  <circle cx="80" cy="80" r="3" fill="#ff0044" opacity="0.7"/>
  <circle cx="120" cy="100" r="3" fill="#ff6600" opacity="0.7"/>
  <circle cx="60" cy="120" r="2" fill="#ffaa00" opacity="0.6"/>
  <circle cx="140" cy="140" r="2" fill="#ff0044" opacity="0.6"/>
  <!-- Warning stripes -->
  <rect x="0" y="210" width="200" height="4" fill="#ff0044" opacity="0.15"/>
  <rect x="0" y="218" width="200" height="2" fill="#ff6600" opacity="0.1"/>
  <!-- Label -->
  <text x="100" y="245" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff0044" opacity="0.5">САБОТАЖНИК // SABOTAGE</text>
  <text x="100" y="260" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff6600" opacity="0.3">NEON MERCENARIES</text>
</svg>