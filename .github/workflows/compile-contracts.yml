name: Compile Smart Contracts

on:
  push:
    branches: [main]
    paths:
      - 'contracts/*.sol'
      - '.github/workflows/compile-contracts.yml'
  workflow_dispatch:

env:
  SOLD_VERSION: "0.77.0"
  TVM_LINKER_REPO: "everx-labs/TVM-linker"

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system deps + Rust
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build xxd file gzip libssl-dev pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Download pre-built sold + stdlib
        run: |
          set -euo pipefail
          mkdir -p tools

          # Download sold binary
          echo "⬇️ Downloading sold $SOLD_VERSION..."
          curl -sL \
            "https://github.com/everx-labs/TVM-Solidity-Compiler/releases/download/${SOLD_VERSION}/sold_${SOLD_VERSION}_linux.gz" \
            -o /tmp/sold.gz
          gunzip /tmp/sold.gz
          chmod +x /tmp/sold
          mv /tmp/sold tools/sold
          echo "✅ sold: $(./tools/sold --version 2>&1)"

          # Download stdlib_sol.tvm
          echo "⬇️ Downloading stdlib_sol.tvm..."
          curl -sL \
            "https://github.com/everx-labs/TVM-Solidity-Compiler/releases/download/${SOLD_VERSION}/stdlib_sol_${SOLD_VERSION}.tvm.gz" \
            -o /tmp/stdlib.gz
          gunzip /tmp/stdlib.gz
          mv /tmp/stdlib_sol_${SOLD_VERSION}.tvm tools/stdlib_sol.tvm
          echo "✅ stdlib_sol.tvm: $(wc -c < tools/stdlib_sol.tvm) bytes"

          echo "tools/" >> $GITHUB_PATH

      - name: Build tvm_linker from source (small crate)
        run: |
          set -euo pipefail
          echo "⬇️ Cloning $TVM_LINKER_REPO..."
          git clone --depth 1 https://github.com/everx-labs/TVM-linker.git /tmp/tvm-linker
          cd /tmp/tvm-linker
          echo "🔨 Building tvm_linker..."
          cargo build --release 2>&1 | tail -5
          cp target/release/tvm_linker $GITHUB_WORKSPACE/tools/
          cd $GITHUB_WORKSPACE
          echo "✅ tvm_linker: $(./tools/tvm_linker --version 2>&1 || echo 'built OK')"

      - name: Compile all contracts + link .tvc
        run: |
          set -euo pipefail
          export PATH="$PWD/tools:$PATH"
          mkdir -p build

          SOLD="$PWD/tools/sold"
          TVM_LINKER="$PWD/tools/tvm_linker"
          STDLIB="$PWD/tools/stdlib_sol.tvm"

          echo "sold version: $($SOLD --version 2>&1)"
          echo "tvm_linker: $(ls -lh $TVM_LINKER | awk '{print $5}')"
          echo "stdlib: $(ls -lh $STDLIB | awk '{print $5}')"

          CONTRACTS=(
            contracts/interfaces.sol
            contracts/GameCardNFTToken.sol
            contracts/GameCardNFTCollection.sol
            contracts/GameMatch.sol
            contracts/PvPStaking.sol
            contracts/Marketplace.sol
          )

          for SRC in "${CONTRACTS[@]}"; do
            NAME="$(basename "$SRC" .sol)"
            echo ""
            echo "📦 Compiling $NAME..."

            $SOLD \
              --tvm-version gosh \
              --output-dir "$PWD/build" \
              --contract "$SRC" \
              "$SRC" || {
              echo "❌ $NAME.sol compilation failed"
              exit 1
            }

            # Link .code → .tvc
            CODE="$PWD/build/${NAME}.code"
            ABI="$PWD/build/${NAME}.abi.json"
            if [ -f "$CODE" ]; then
              echo "🔗 Linking ${NAME}.code → .tvc..."
              $TVM_LINKER compile "$CODE" \
                --abi "$ABI" \
                --lib "$STDLIB" \
                -o "$PWD/build/${NAME}.tvc" || {
                echo "⚠️  tvm_linker failed for $NAME (non-fatal)"
              }
            fi
          done

      - name: List artifacts
        run: |
          echo "=== build/ artifacts ==="
          ls -lh build/

      - name: Smoke test
        run: |
          set -euo pipefail
          ERROR=0
          echo "=== Smoke tests ==="
          for F in build/*.tvc; do
            [ -f "$F" ] || continue
            SIZE=$(stat --format="%s" "$F")
            if [ "$SIZE" -gt 500 ]; then
              echo "✅ $(basename $F): ${SIZE} bytes"
            else
              echo "❌ $(basename $F): too small ${SIZE} bytes"
              ERROR=1
            fi
          done
          for F in build/*.abi.json; do
            [ -f "$F" ] || continue
            echo "📄 $(basename $F): $(wc -c < "$F") bytes"
          done
          # Must have Collection tvc
          if [ ! -f "build/GameCardNFTCollection.tvc" ]; then
            echo "❌ GameCardNFTCollection.tvc missing!"
            ERROR=1
          fi
          [ "$ERROR" -eq 0 ] || exit 1
          echo "🎉 All checks passed!"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contracts
          path: build/
          retention-days: 90
