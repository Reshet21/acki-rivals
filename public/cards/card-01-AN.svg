<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0A0A1A"/><stop offset="50%" stop-color="#12122A"/><stop offset="100%" stop-color="#0D0D22"/></linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7B61FF"/><stop offset="100%" stop-color="#00E5FF"/></linearGradient>
    <filter id="neon"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="neon-strong"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Card background -->
  <rect width="200" height="280" rx="16" fill="url(#bg1)"/>
  <rect x="1" y="1" width="198" height="278" rx="15" fill="none" stroke="url(#glow1)" stroke-width="1.5" opacity="0.3"/>
  <!-- Circuit pattern -->
  <g stroke="#7B61FF" stroke-width="0.3" opacity="0.1" fill="none">
    <path d="M20,40 L40,40 L60,20 L100,20"/><path d="M180,40 L160,40 L140,20 L100,20"/>
    <path d="M30,60 L30,80 L50,100 L50,120"/><path d="M170,60 L170,80 L150,100 L150,120"/>
    <circle cx="100" cy="20" r="2" fill="#7B61FF" opacity="0.3"/>
    <circle cx="50" cy="120" r="2" fill="#00E5FF" opacity="0.3"/>
    <circle cx="150" cy="120" r="2" fill="#00E5FF" opacity="0.3"/>
  </g>
  <!-- Robot character -->
  <g transform="translate(100,130)">
    <!-- Body -->
    <rect x="-22" y="-35" width="44" height="55" rx="6" fill="#1A1A3A" stroke="#7B61FF" stroke-width="1.5"/>
    <!-- Head -->
    <rect x="-16" y="-55" width="32" height="25" rx="4" fill="#12122A" stroke="#00E5FF" stroke-width="1"/>
    <!-- Eyes -->
    <circle cx="-6" cy="-45" r="5" fill="#7B61FF" filter="url(#neon)"/>
    <circle cx="6" cy="-45" r="5" fill="#00E5FF" filter="url(#neon)"/>
    <circle cx="-6" cy="-45" r="2" fill="#fff"/>
    <circle cx="6" cy="-45" r="2" fill="#fff"/>
    <!-- Antenna -->
    <line x1="0" y1="-55" x2="0" y2="-65" stroke="#00E5FF" stroke-width="1.5" filter="url(#neon)"/>
    <circle cx="0" cy="-67" r="3" fill="#00E5FF" filter="url(#neon-strong)"/>
    <!-- Arms -->
    <rect x="-30" y="-25" width="8" height="25" rx="3" fill="#12122A" stroke="#7B61FF" stroke-width="0.8"/>
    <rect x="22" y="-25" width="8" height="25" rx="3" fill="#12122A" stroke="#7B61FF" stroke-width="0.8"/>
    <!-- Chest light -->
    <circle cx="0" cy="-15" r="6" fill="#7B61FF" opacity="0.4" filter="url(#neon)"/>
    <circle cx="0" cy="-15" r="3" fill="#00E5FF" filter="url(#neon)"/>
    <!-- Legs -->
    <rect x="-16" y="20" width="10" height="20" rx="2" fill="#12122A" stroke="#666" stroke-width="0.5"/>
    <rect x="6" y="20" width="10" height="20" rx="2" fill="#12122A" stroke="#666" stroke-width="0.5"/>
  </g>
  <!-- AN badge -->
  <rect x="5" y="5" width="35" height="16" rx="4" fill="#7B61FF" opacity="0.8"/>
  <text x="22" y="16" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="8" fill="#fff">AN</text>
  <!-- Card info -->
  <rect x="10" y="200" width="180" height="70" rx="8" fill="rgba(0,0,0,0.5)"/>
  <text x="100" y="218" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="10" fill="#EEEEFF">АКИ-ДРОН</text>
  <text x="100" y="232" text-anchor="middle" font-family="monospace" font-size="8" fill="#A0A0C8">Неоновые Наемники</text>
  <rect x="20" y="242" width="160" height="1" fill="#7B61FF" opacity="0.2"/>
  <text x="30" y="258" font-family="monospace" font-size="8" fill="#7B61FF">⚡ 3</text>
  <text x="90" y="258" font-family="monospace" font-size="8" fill="#FF6B9D">💥 2</text>
  <text x="140" y="258" font-family="monospace" font-size="7" fill="#00E5FF">+1 pillz</text>
  <!-- Rarity dot -->
  <circle cx="185" cy="15" r="4" fill="#60608A"/>
</svg>